                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>

                <div class="pt-2">
                    <button onclick="resetDemoData()" class="w-full py-2.5 text-xs text-rose-600 font-normal hover:bg-rose-50 rounded-xl transition-colors">
                        Demoyu Sıfırla / Fabrika Ayarları
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // --- 1. Dynamic Canvas Icon Generator (Requirement #4) ---
        // Solid white (#FFFFFF) background with single centered soft pastel sky-blue circle (#A3D5FF)
        function generateAppIcon() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // Solid white background
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, 512, 512);

                // Centered soft pastel sky-blue circle (#A3D5FF), radius ~128px (25% canvas width)
                ctx.beginPath();
                ctx.arc(256, 256, 128, 0, 2 * Math.PI, false);
                ctx.fillStyle = '#A3D5FF';
                ctx.fill();

                const dataUrl = canvas.toDataURL('image/png');

                // Assign to favicon, apple-touch-icon, and dynamic manifest
                const favicon = document.getElementById('app-favicon');
                if (favicon) favicon.href = dataUrl;

                const appleIcon = document.getElementById('apple-touch-icon');
                if (appleIcon) appleIcon.href = dataUrl;

                const manifestObj = {
                    name: "Günlük Takip",
                    short_name: "Takip",
                    start_url: "./",
                    display: "standalone",
                    background_color: "#FFFFFF",
                    theme_color: "#FFFFFF",
                    icons: [
                        {
                            src: dataUrl,
                            sizes: "512x512",
                            type: "image/png",
                            purpose: "any maskable"
                        }
                    ]
                };

                const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
                const manifestUrl = URL.createObjectURL(blob);
                const manifestLink = document.getElementById('app-manifest');
                if (manifestLink) manifestLink.href = manifestUrl;
            } catch(e) {
                console.error("Icon generator error:", e);
            }
        }

        // --- 2. Initial State & Offline LocalStorage ---
        const STORAGE_KEY = 'gunluk_takip_app_state_v3';

        function getInitialData() {
            const todayStr = getTodayISO();
            
            // Build 84 days history mock for heatmaps
            const history = {};
            const startDate = new Date();
            startDate.setDate(startDate.getDate() - 83);
            
            for(let i = 0; i < 84; i++) {
                const d = new Date(startDate);
                d.setDate(d.getDate() + i);
                const key = d.toISOString().split('T')[0];
                
                // Deterministic realistic variance
                const dayNum = d.getDate();
                const taskScore = Math.min(100, Math.max(30, (dayNum * 7) % 70 + 35));
                const moodScore = Math.min(5, Math.max(1, ((dayNum * 3) % 5) + 1));
                const combinedScore = Math.round((taskScore * 0.6) + (moodScore * 20 * 0.4));
                
                history[key] = {
                    taskScore: taskScore,
                    moodScore: moodScore,
                    combinedScore: combinedScore,
                    completedCount: Math.round(taskScore / 20),
                    note: (i % 7 === 0) ? "Haftalık değerlendirme tamamlandı." : (i % 5 === 0 ? "Güzel bir gün." : "")
                };
            }

            // Current today values
            history[todayStr] = {
                taskScore: 83,
                moodScore: 4,
                combinedScore: 86,
                completedCount: 5,
                note: "Bugün hedeflerimi başarmak harika hissettirdi."
            };

            return {
                currentTab: 'dashboard',
                tasks: [
                    { id: '1', title: 'Sabah Yürüyüşü (30 dk)', category: 'Sağlık & Spor', time: '08:00', completed: true, date: todayStr },
                    { id: '2', title: 'Günlük Proje Raporunu Yaz', category: 'İş / Çalışma', time: '10:30', completed: true, date: todayStr },
                    { id: '3', title: 'Kitap Oku (20 Sayfa)', category: 'Kişisel Gelişim', time: '14:00', completed: true, date: todayStr },
                    { id: '4', title: 'B2 İngilizce Dinleme Pratiği', category: 'Kişisel Gelişim', time: '16:30', completed: true, date: todayStr },
                    { id: '5', title: 'Akşam Yemeği Hazırlığı', category: 'Ev / Düzen', time: '19:00', completed: true, date: todayStr },
                    { id: '6', title: 'Günü Değerlendir ve Not Al', category: 'Kişisel Gelişim', time: '21:30', completed: false, date: todayStr }
                ],
                habits: [
                    { id: 'h1', title: '2 Litre Su İç', color: 'indigo', streak: 12, total: 42, history: Array(35).fill(false).map((_, idx) => idx % 2 === 0 || idx > 25) },
                    { id: 'h2', title: 'Erken Uyan (07:00)', color: 'amber', streak: 5, total: 28, history: Array(35).fill(false).map((_, idx) => idx % 3 !== 0) },
                    { id: 'h3', title: 'Şekersiz Gün', color: 'emerald', streak: 8, total: 31, history: Array(35).fill(false).map((_, idx) => idx > 7) },
                    { id: 'h4', title: '10 Bin Adım At', color: 'slate', streak: 14, total: 55, history: Array(35).fill(true) }
                ],
                goals: [
                    {
                        id: 'g1',
                        title: 'B2 İngilizce Sertifikası',
                        targetDate: '2026-12-31',
                        subtasks: [
                            { id: 'st1', text: 'Grammar Kitabını Bitir', done: true },
                            { id: 'st2', text: '500 Yeni Kelime Ezberle', done: true },
                            { id: 'st3', text: '10 Tane Deneme Sınavı Çöz', done: false },
                            { id: 'st4', text: 'Sertifika Başvurusu Yap', done: false }
                        ]
                    },
                    {
                        id: 'g2',
                        title: '10 KM Maraton Koşusu',
                        targetDate: '2027-02-15',
                        subtasks: [
                            { id: 'st5', text: 'Koşu Ayakkabısı Al', done: true },
                            { id: 'st6', text: 'Haftada 3 Gün Koşu Antrenmanı', done: true },
                            { id: 'st7', text: 'Beslenme Düzenini İyileştir', done: false }
                        ]
                    }
                ],
                todayMood: 4,
                todayNote: "Bugün verimli ve huzurlu geçti.",
                history: history,
                selectedAnalysisDate: todayStr
            };
        }

        let appState = loadState();

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch(e) {
                console.error("Failed to load state", e);
            }
            return getInitialData();
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch(e) {
                console.error("Failed to save state", e);
            }
        }

        function getTodayISO() {
            return new Date().toISOString().split('T')[0];
        }

        // --- 3. Notification & Audio Web API ---
        function playChimeSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.3); // G5
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(now);
                osc.stop(now + 0.8);
            } catch(e) {
                console.log("Audio chime error:", e);
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    const btn = document.getElementById('notification-btn');
                    if (permission === "granted") {
                        if (btn) btn.innerText = "Sistem Bildirimleri Etkin ✓";
                    } else {
                        if (btn) btn.innerText = "Bildirim İzni Reddedildi";
                    }
                });
            }
        }

        function triggerTaskAlarm(taskTitle) {
            playChimeSound();
            
            // In-App Banner
            const banner = document.getElementById('alarm-banner');
            const titleEl = document.getElementById('alarm-banner-title');
            if (banner && titleEl) {
                titleEl.innerText = taskTitle;
                banner.classList.remove('-translate-y-full');
                setTimeout(() => {
                    banner.classList.add('-translate-y-full');
                }, 6000);
            }

            // Web System Notification
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("Görev Hatırlatması", {
                    body: taskTitle,
                    icon: document.getElementById('app-favicon')?.href || ''
                });
            }
        }

        function dismissAlarmBanner() {
            const banner = document.getElementById('alarm-banner');
            if (banner) banner.classList.add('-translate-y-full');
        }

        // Schedule Check Timer
        let firedAlarms = new Set();
        setInterval(() => {
            const now = new Date();
            const currentHHMM = now.toTimeString().slice(0, 5);
            const todayStr = getTodayISO();

            appState.tasks.forEach(t => {
                if (t.time && !t.completed && t.date === todayStr && t.time === currentHHMM) {
                    const alarmKey = `${t.id}_${currentHHMM}`;
                    if (!firedAlarms.has(alarmKey)) {
                        firedAlarms.add(alarmKey);
                        triggerTaskAlarm(t.title);
                    }
                }
            });
        }, 15000);

        // Download .ics Calendar File for Lock-screen Reminder
        function downloadICS(title, timeStr) {
            const now = new Date();
            const dateStr = now.toISOString().replace(/-|:|\.\d\d\d/g, "").slice(0, 8);
            const timeClean = timeStr ? timeStr.replace(":", "") + "00" : "090000";
            
            const icsContent = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//GunlukTakip//PWA App//TR
BEGIN:VEVENT
SUMMARY:${title}
DTSTART:${dateStr}T${timeClean}
DESCRIPTION:Günlük Takip Görevi
STATUS:CONFIRMED
BEGIN:VALARM
TRIGGER:-PT5M
ACTION:DISPLAY
DESCRIPTION:Hatırlatma
END:VALARM
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `${title.replace(/\s+/g, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

            let greeting = "İyi günler, Burak";
            if (hour >= 5 && hour < 12) greeting = "Günaydın, Burak";
            else if (hour >= 18 || hour < 5) greeting = "İyi akşamlar, Burak";
            
            if (greetingEl) greetingEl.innerText = greeting;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const todayFormatted = new Date().toLocaleDateString('tr-TR', options);
            if (dateEl) dateEl.innerText = todayFormatted;
        }

        function checkInHabit(habitId) {
            const h = appState.habits.find(x => x.id === habitId);
            if (h) {
                h.streak += 1;
                h.total += 1;
                h.history[h.history.length - 1] = true;
                saveState();
                renderContent();
            }
        }

        function saveHabit() {
            const title = document.getElementById('habit-input-title').value.trim();
            const color = document.getElementById('habit-input-color').value;

            if (!title) return;

            appState.habits.push({
                id: 'h_' + Date.now(),
                title: title,
                color: color,
                streak: 1,
                total: 1,
                history: Array(35).fill(false).map((_, i) => i === 34)
            });

            saveState();
            closeModal('modal-habit');
            document.getElementById('habit-input-title').value = '';
            renderContent();
        }

        function deleteHabit(id) {
            appState.habits = appState.habits.filter(x => x.id !== id);
            saveState();
            renderContent();
        }

        // --- TAB 3: ANALİZ (HEATMAPS) ---
        // REQUIREMENT #3: Heatmap cells MUST be perfect squares (aspect-square w-full rounded-[4px])
        function renderAnalysis(container) {
            const dates = Object.keys(appState.history).sort();
            const last84Dates = dates.slice(-84);

            const selectedDate = appState.selectedAnalysisDate || getTodayISO();
            const selectedDetail = appState.history[selectedDate] || { taskScore: 0, moodScore: 0, combinedScore: 0, completedCount: 0, note: 'Kayıt bulunamadı' };

            container.innerHTML = `
                <div class="mb-5">
                    <h2 class="text-xl font-normal text-slate-900">Analiz & Isı Haritaları</h2>
                    <p class="text-xs text-slate-500 font-normal mt-0.5">84 Günlük (12 Haftalık) Bütünsel Performans</p>
                </div>

                <!-- Clicked Day Summary Top Card -->
                <div class="bg-slate-900 text-white rounded-3xl p-5 shadow-xl mb-6 border border-slate-800">
                    <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-3">
                        <div>
                            <span class="text-[10px] text-orange-400 font-medium uppercase tracking-wider block">Seçili Gün Detayı</span>
                            <div class="text-sm font-normal text-white mt-0.5 tabular-nums">${formatDateTr(selectedDate)}</div>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-normal text-orange-400 tabular-nums">${selectedDetail.combinedScore}</span>
                            <span class="text-[10px] text-slate-400 block">Birleşik Puan</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center pt-1">
                        <div class="bg-slate-800/60 rounded-2xl p-2.5">
                            <div class="text-[10px] text-slate-400 font-normal">Görev Puanı</div>
                            <div class="text-base font-normal text-white mt-0.5 tabular-nums">${selectedDetail.taskScore}%</div>
                        </div>
                        <div class="bg-slate-800/60 rounded-2xl p-2.5">
                            <div class="text-[10px] text-slate-400 font-normal">Moral Puanı</div>
                            <div class="text-base font-normal text-white mt-0.5 tabular-nums">${selectedDetail.moodScore}/5</div>
                        </div>
                        <div class="bg-slate-800/60 rounded-2xl p-2.5">
                            <div class="text-[10px] text-slate-400 font-normal">Tamamlanan</div>
                            <div class="text-base font-normal text-white mt-0.5 tabular-nums">${selectedDetail.completedCount} Görev</div>
                        </div>
                    </div>
                    ${selectedDetail.note ? `
                        <div class="mt-3 text-xs text-slate-300 font-normal bg-slate-800/40 rounded-xl p-2.5 border border-slate-800">
                            "${escapeHTML(selectedDetail.note)}"
                        </div>
                    ` : ''}
                </div>

                <!-- Heatmap 1: Görev Puanı (Orange Palette) -->
                <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mb-5">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-normal text-slate-900">1. Görev Puanı Isı Haritası</h3>
                        <span class="text-[10px] text-slate-400 font-normal">Turuncu Tonlar</span>
                    </div>
                    <div class="grid grid-cols-12 gap-1.5 w-full">
                        ${last84Dates.map(dateKey => {
                            const val = appState.history[dateKey]?.taskScore || 0;
                            const color = getOrangeHeatColor(val);
                            const isSelected = dateKey === selectedDate;
                            return `
                                <button onclick="selectAnalysisDate('${dateKey}')" title="${dateKey}: %${val}" class="aspect-square w-full rounded-[4px] ${color} ${isSelected ? 'ring-2 ring-slate-900 scale-110 z-10' : ''} transition-all hover:scale-105"></button>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- Heatmap 2: Gün & Moral Puanı (Indigo/Blue Palette) -->
                <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mb-5">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-normal text-slate-900">2. Gün & Moral Puanı Isı Haritası</h3>
                        <span class="text-[10px] text-slate-400 font-normal">İndigo/Mavi Tonlar</span>
                    </div>
                    <div class="grid grid-cols-12 gap-1.5 w-full">
                        ${last84Dates.map(dateKey => {
                            const val = appState.history[dateKey]?.moodScore || 0;
                            const color = getBlueHeatColor(val);
                            const isSelected = dateKey === selectedDate;
                            return `
                                <button onclick="selectAnalysisDate('${dateKey}')" title="${dateKey}: Moral ${val}/5" class="aspect-square w-full rounded-[4px] ${color} ${isSelected ? 'ring-2 ring-slate-900 scale-110 z-10' : ''} transition-all hover:scale-105"></button>
                            `;
                        }).join('')}
                    </div>
                </div>

                <!-- Heatmap 3: Birleşik Skor (Emerald Palette) -->
                <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-sm font-normal text-slate-900">3. Birleşik Skor Isı Haritası</h3>
                        <span class="text-[10px] text-slate-400 font-normal">Zümrüt Yeşil Tonlar</span>
                    </div>
                    <div class="grid grid-cols-12 gap-1.5 w-full">
                        ${last84Dates.map(dateKey => {
                            const val = appState.history[dateKey]?.combinedScore || 0;
                            const color = getGreenHeatColor(val);
                            const isSelected = dateKey === selectedDate;
                            return `
                                <button onclick="selectAnalysisDate('${dateKey}')" title="${dateKey}: Skor ${val}" class="aspect-square w-full rounded-[4px] ${color} ${isSelected ? 'ring-2 ring-slate-900 scale-110 z-10' : ''} transition-all hover:scale-105"></button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function getOrangeHeatColor(val) {
            if (val === 0) return 'bg-slate-100';
            if (val < 25) return 'bg-amber-100';
            if (val < 50) return 'bg-amber-300';
            if (val < 75) return 'bg-orange-400';
            return 'bg-orange-600';
        }

        function getBlueHeatColor(moodVal) {
            if (moodVal <= 1) return 'bg-indigo-100';
            if (moodVal === 2) return 'bg-indigo-200';
            if (moodVal === 3) return 'bg-indigo-400';
            if (moodVal === 4) return 'bg-indigo-600';
            return 'bg-indigo-800';
        }

        function getGreenHeatColor(val) {
            if (val === 0) return 'bg-slate-100';
            if (val < 30) return 'bg-emerald-100';
            if (val < 60) return 'bg-emerald-300';
            if (val < 80) return 'bg-emerald-500';
            return 'bg-emerald-700';
        }

        function selectAnalysisDate(dateStr) {
            appState.selectedAnalysisDate = dateStr;
            saveState();
            renderContent();
        }

        function formatDateTr(isoStr) {
            if (!isoStr) return '';
            const parts = isoStr.split('-');
            if (parts.length < 3) return isoStr;
            const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
            return `${parseInt(parts[2])} ${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
        }

        // --- TAB 4: HEDEFLER (GOALS) ---
        function renderGoals(container) {
            container.innerHTML = `
                <div class="flex items-center justify-between mb-5">
                    <div>
                        <h2 class="text-xl font-normal text-slate-900">Uzun Vadeli Hedefler</h2>
                        <p class="text-xs text-slate-500 font-normal mt-0.5">Alt adımlar ve kalan gün sayacı</p>
                    </div>
                    <button onclick="openModal('modal-goal')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-normal px-3.5 py-2 rounded-xl transition-colors flex items-center shadow-sm">
                        <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Hedef Ekle
                    </button>
                </div>

                <div class="space-y-4 mb-6">
                    ${appState.goals.length === 0 ? '<div class="text-center py-8 text-xs text-slate-400 font-normal">Henüz bir hedef eklenmedi.</div>' : ''}
                    ${appState.goals.map(goal => renderGoalCard(goal)).join('')}
                </div>
            `;
        }

        function renderGoalCard(goal) {
            const today = new Date();
            const target = new Date(goal.targetDate);
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            const completedSubtasks = goal.subtasks.filter(st => st.done).length;
            const totalSubtasks = goal.subtasks.length;
            const progress = totalSubtasks === 0 ? 0 : Math.round((completedSubtasks / totalSubtasks) * 100);

            return `
                <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <h3 class="text-base font-normal text-slate-900">${escapeHTML(goal.title)}</h3>
                            <div class="text-xs text-slate-400 font-normal mt-0.5 tabular-nums">Hedef: ${formatDateTr(goal.targetDate)}</div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-normal ${diffDays < 30 ? 'bg-amber-50 text-amber-600 border border-amber-200' : 'bg-slate-100 text-slate-600'} px-2.5 py-1 rounded-full tabular-nums">
                                ${diffDays > 0 ? `${diffDays} gün kaldı` : 'Süre doldu'}
                            </span>
                            <button onclick="deleteGoal('${goal.id}')" class="text-slate-300 hover:text-rose-500 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="mb-4">
                        <div class="flex justify-between text-xs text-slate-500 mb-1.5 font-normal">
                            <span>İlerleme</span>
                            <span class="tabular-nums">${progress}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-orange-500 h-2 rounded-full transition-all duration-500" style="width: ${progress}%;"></div>
                        </div>
                    </div>

                    <!-- Milestones / Subtasks -->
                    <div class="space-y-2 pt-2 border-t border-slate-100">
                        ${goal.subtasks.map(st => `
                            <div class="flex items-center justify-between text-xs">
                                <button onclick="toggleSubtask('${goal.id}', '${st.id}')" class="flex items-center space-x-2 text-left">
                                    <div class="w-4 h-4 rounded border ${st.done ? 'bg-orange-500 border-orange-500 text-white' : 'border-slate-300 bg-white'} flex items-center justify-center flex-shrink-0 transition-colors">
                                        ${st.done ? '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                                    </div>
                                    <span class="${st.done ? 'line-through text-slate-400' : 'text-slate-700'} font-normal">${escapeHTML(st.text)}</span>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleSubtask(goalId, subtaskId) {
            const g = appState.goals.find(x => x.id === goalId);
            if (g) {
                const st = g.subtasks.find(x => x.id === subtaskId);
                if (st) {
                    st.done = !st.done;
                    saveState();
                    renderContent();
                }
            }
        }

        function saveGoal() {
            const title = document.getElementById('goal-input-title').value.trim();
            const date = document.getElementById('goal-input-date').value;
            const subtasksRaw = document.getElementById('goal-input-subtasks').value.trim();

            if (!title || !date) return;

            const subtasks = subtasksRaw ? subtasksRaw.split(',').map((st, i) => ({
                id: 'st_' + Date.now() + '_' + i,
                text: st.trim(),
                done: false
            })) : [];

            appState.goals.push({
                id: 'g_' + Date.now(),
                title: title,
                targetDate: date,
                subtasks: subtasks
            });

            saveState();
            closeModal('modal-goal');
            document.getElementById('goal-input-title').value = '';
            document.getElementById('goal-input-subtasks').value = '';
            renderContent();
        }

        function deleteGoal(id) {
            appState.goals = appState.goals.filter(x => x.id !== id);
            saveState();
            renderContent();
        }

        // --- 5. Backup & Import & Modals ---
        function openModal(modalId) {
            const m = document.getElementById(modalId);
            if (m) m.classList.remove('hidden');
        }

        function closeModal(modalId) {
            const m = document.getElementById(modalId);
            if (m) m.classList.add('hidden');
        }

        function openSettingsModal() {
            openModal('modal-settings');
        }

        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `gunluk_takip_yedek_${getTodayISO()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importDataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && typeof parsed === 'object') {
                        appState = parsed;
                        saveState();
                        closeModal('modal-settings');
                        renderContent();
                        alert('Yedek başarıyla yüklendi.');
                    }
                } catch(err) {
                    alert('Geçersiz JSON dosyası!');
                }
            };
            reader.readAsText(file);
        }

        function resetDemoData() {
            if (confirm('Tüm veriler varsayılan demo verisi ile sıfırlanacak. Onaylıyor musunuz?')) {
                localStorage.removeItem(STORAGE_KEY);
                appState = getInitialData();
                saveState();
                closeModal('modal-settings');
                renderContent();
            }
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // --- 6. App Lifecycle Startup ---
        window.onload = function() {
            generateAppIcon();
            updateHeader();
            renderContent();
        };
    </script>
</body>
</html>
